<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Netflix Pro Clone</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial, sans-serif;
}

body{
background:#141414;
color:white;
}

header{
display:flex;
justify-content:space-between;
align-items:center;
padding:20px 50px;
position:fixed;
top:0;
width:100%;
background:rgba(0,0,0,0.8);
z-index:1000;
}

.logo{
color:#e50914;
font-size:28px;
font-weight:bold;
letter-spacing:2px;
}

.banner{
height:90vh;
background:url("https://image.tmdb.org/t/p/original/6MKr3KgOLmzOP6MSuZERO41Lpkt.jpg") center/cover no-repeat;
display:flex;
align-items:center;
padding:60px;
position:relative;
}

.banner::after{
content:"";
position:absolute;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.6);
}

.banner-content{
position:relative;
z-index:1;
max-width:600px;
}

.banner h1{
font-size:60px;
margin-bottom:10px;
}

.banner p{
font-size:18px;
opacity:0.8;
}

.row{
padding:20px 50px;
}

.row h2{
margin-bottom:15px;
}

.movies{
display:flex;
gap:15px;
overflow-x:auto;
scroll-behavior:smooth;
padding-bottom:10px;
}

.movies::-webkit-scrollbar{
display:none;
}


.movie-card{
min-width:180px;
transition:0.3s;
cursor:pointer;
text-align:center;
}

.movie-card img{
width:100%;
height:260px;
border-radius:10px;
object-fit:cover;
transition:0.3s;
}

.movie-card:hover img{
transform:scale(1.08);
box-shadow:0 10px 20px rgba(0,0,0,0.6);
}

.movie-card p{
margin-top:8px;
font-size:14px;
opacity:0.8;
}
</style>

</head>

<body>

<header>
<div class="logo">NETFLIX</div>
</header>

<div class="banner">
<div class="banner-content">
<h1>Unlimited Movies</h1>
<p>Watch anytime, anywhere.</p>
</div>
</div>


<div class="row">
<h2>Trending Now</h2>

<div class="movies">

<div class="movie-card">
<img src="https://image.tmdb.org/t/p/w500/8Vt6mWEReuy4Of61Lnj5Xj704m8.jpg">
<p>Avengers: Endgame</p>
</div>

<div class="movie-card">
<img src="https://image.tmdb.org/t/p/w500/9gk7adHYeDvHkCSEqAvQNLV5Uge.jpg">
<p>Inception</p>
</div>

<div class="movie-card">
<img src="https://image.tmdb.org/t/p/w500/udDclJoHjfjb8Ekgsd4FDteOkCU.jpg">
<p>Joker</p>
</div>

<div class="movie-card">
<img src="https://image.tmdb.org/t/p/w500/6DrHO1jr3qVrViUO6s6kFiAGM7.jpg">
<p>Stranger Things</p>
</div>

<div class="movie-card">
<img src="https://image.tmdb.org/t/p/w500/5KCVkau1HEl7ZzfPsKAPM0sMiKc.jpg">
<p>Spider-Man</p>
</div>

<div class="movie-card">
<img src="https://image.tmdb.org/t/p/w500/qJ2tW6WMUDux911r6m7haRef0WH.jpg">
<p>The Dark Knight</p>
</div>

</div>
</div>



<div class="row">
<h2>Top Rated</h2>

<div class="movies">

<div class="movie-card">
<img src="https://image.tmdb.org/t/p/w500/9gk7adHYeDvHkCSEqAvQNLV5Uge.jpg">
<p>Batman</p>
</div>

<div class="movie-card">
<img src="https://image.tmdb.org/t/p/w500/5KCVkau1HEl7ZzfPsKAPM0sMiKc.jpg">
<p>Spider-Man</p>
</div>

<div class="movie-card">
<img src="https://image.tmdb.org/t/p/w500/3bhkrj58Vtu7enYsRolD1fZdja1.jpg">
<p>Godfather</p>
</div>

</div>
</div>

</body>
</html>
